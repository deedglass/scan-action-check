name: Deedglass comment
on:
  workflow_run: # zizmor: ignore[dangerous-triggers] never checks out PR code; the artifact is validated
    workflows: ["Deedglass scan"]
    types: [completed]
permissions: {}
jobs:
  comment:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      actions: read
    steps:
      - uses: deedglass/scan-action/comment@645c2571a7d678f475f0081df8b245fec68d5134 # release candidate
